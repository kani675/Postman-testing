services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: user_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Runs the Postman collection against the app, then exits with pass/fail
  newman:
    image: postman/newman:alpine
    volumes:
      - ./postman:/etc/newman
    command: run users-api.postman_collection.json --env-var baseUrl=http://app:3000
    depends_on:
      app:
        condition: service_healthy
